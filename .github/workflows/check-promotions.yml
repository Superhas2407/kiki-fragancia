name: Check store promotions

on:
  pull_request:
    paths:
      - 'src/data/store-promotions.js'
      - 'src/lib/cart-promotions.js'
      - 'src/components/CartDrawer.jsx'
      - 'src/components/VitrinaCard.jsx'
      - 'src/pages/ArmarCombo.jsx'
      - 'src/pages/ProductDetail.jsx'
      - 'src/pages/Tienda.jsx'
      - 'scripts/test-cart-promotions.mjs'
      - 'scripts/test-november-campaigns.mjs'
      - '.github/workflows/check-promotions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-cart-promotions.mjs
      - run: node scripts/test-november-campaigns.mjs
      # The image manifest is generated by optimize-images.mjs in the real deployment.\n      # A minimal manifest is enough to verify code compilation without processing images.\n      - run: printf '{}' > src/data/responsive-images.json\n      - run: npx vite build
