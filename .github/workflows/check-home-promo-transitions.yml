name: Homepage promotion section transitions
on:
  pull_request:
    paths:
      - 'src/index.css'
      - 'src/pages/Landing.jsx'
      - 'src/components/BlackFridaySection.jsx'
      - 'scripts/test-home-promo-transitions.mjs'
      - '.github/workflows/check-home-promo-transitions.yml'
permissions:
  contents: read
jobs:
  transitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/test-home-promo-transitions.mjs
      - run: node scripts/test-promotion-home-banner.mjs
      - run: node scripts/test-cart-promotions.mjs
      - run: printf '{}' > src/data/responsive-images.json
      - run: npx vite build
