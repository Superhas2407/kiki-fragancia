name: Import original Kiki promotion banners
on:
  push:
    branches:
      - chore/store-original-promo-images-20261123
    paths:
      - .github/workflows/import-original-promo-banners.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import original desktop/mobile approved artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/promociones
          curl --fail --location --retry 3 --max-time 40 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3EN6bmi6QIZqo3bRCvLM2434GA1/ef460d69-28eb-4d3f-89d5-d7a0b916d750.jpg' --output public/promociones/portada-desktop.jpg
          curl --fail --location --retry 3 --max-time 40 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3EN6bmi6QIZqo3bRCvLM2434GA1/09ec24a1-42e8-425b-97bc-a88e8dc380ec.jpg' --output public/promociones/portada-mobile.jpg
          file public/promociones/portada-desktop.jpg public/promociones/portada-mobile.jpg
          test "$(wc -c < public/promociones/portada-desktop.jpg)" -gt 100000
          test "$(wc -c < public/promociones/portada-mobile.jpg)" -gt 100000
          file --mime-type public/promociones/portada-desktop.jpg | grep -q 'image/jpeg'
          file --mime-type public/promociones/portada-mobile.jpg | grep -q 'image/jpeg'
      - name: Commit original images to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/promociones/portada-desktop.jpg public/promociones/portada-mobile.jpg
          git diff --cached --quiet || (git commit -m 'assets: preserve Kiki approved desktop/mobile promotion photography' && git push origin HEAD:chore/store-original-promo-images-20261123)
