name: Check Sanity Studio

on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/check-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: node --test tests/catalog.test.mjs
      - run: npm run build
